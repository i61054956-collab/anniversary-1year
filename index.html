<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subratha & Irfan — 1 Year</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050a;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent: #ff4081;
            --champagne: #f3e5ab;
            --text-main: #f8f9fa;
            --text-muted: #8a8d9b;
            --glass-bg: rgba(12, 12, 22, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,64,129,0.08) 0%, rgba(5,5,10,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Password / Lock Screen Overlay */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: #030307;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .lock-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 380px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .lock-title {
            font-family: 'Cinzel', serif;
            color: var(--champagne);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
        }

        .lock-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.8rem;
        }

        .password-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .password-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--surface-border);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .password-input:focus {
            border-color: var(--accent);
        }

        .unlock-btn {
            background: linear-gradient(135deg, rgba(255,64,129,0.3), rgba(255,64,129,0.1));
            border: 1px solid var(--accent);
            color: #fff;
            font-family: 'Cinzel', serif;
            padding: 0.9rem 1.8rem;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .unlock-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.5);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 1.2em;
            display: none;
        }

        /* Floating Audio Player */
        #player-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 8000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px 8px 10px;
            border-radius: 40px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .player-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .player-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 64, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0); }
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .track-artist {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* View Container */
        #view-container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem 6rem;
            transition: opacity 0.35s ease;
        }

        .view-hidden { opacity: 0; }

        /* Navigation Bar */
        .nav-links-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 0.8rem 1.8rem;
            border: 1px solid var(--surface-border);
            border-radius: 30px;
            color: var(--text-main);
            text-decoration: none;
            background: var(--surface);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
        }

        .nav-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Typography & Components */
        h1, h2, h3 { font-family: 'Cinzel', serif; }

        .hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }

        .hero-names {
            font-size: 2.5rem;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, #ffffff 0%, var(--champagne) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .typewriter-text {
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 0.1em;
            min-height: 1.8em;
            font-weight: 300;
        }

        /* Timeline Section */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 3rem 0;
            position: relative;
        }

        .timeline-card {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--surface-border);
            padding-right: 1rem;
            text-align: center;
        }

        .date-month-day {
            font-family: 'Cinzel', serif;
            color: var(--champagne);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .date-year {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card-body h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card-body p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 2rem;
        }

        .photo-box {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            cursor: pointer;
            animation: fadeIn 0.5s ease forwards;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .photo-box:hover img { transform: scale(1.08); }

        .load-more-btn {
            display: block;
            margin: 2.5rem auto 0;
            padding: 0.9rem 2.2rem;
            border-radius: 30px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--champagne);
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255,64,129,0.2);
        }

        /* Reels Section */
        .reels-wrapper {
            height: 75vh;
            max-width: 420px;
            margin: 2rem auto 0;
            overflow-y: scroll;
            snap-type: y mandatory;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: #000;
            scrollbar-width: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .reels-wrapper::-webkit-scrollbar { display: none; }

        .reel-card {
            height: 100%;
            width: 100%;
            snap-align: start;
            snap-stop: always;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .reel-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 20;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 1rem;
            border-radius: 12px;
            pointer-events: none;
        }

        .reel-overlay h4 {
            font-family: 'Outfit', sans-serif;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .hero-names { font-size: 1.8rem; }
            .timeline-card { grid-template-columns: 1fr; gap: 0.8rem; }
            .date-block { border-right: none; border-bottom: 1px solid var(--surface-border); padding-right: 0; padding-bottom: 0.8rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .reels-wrapper { height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Password / Lock Screen -->

        <div class="lock-card">
            <span class="lock-icon">🔒</span>

    <div id="view-container"></div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged Memory">

        const track = document.getElementById('track');
        const playBtn = document.getElementById('playBtn');
        let renderedPhotoCount = 0;

        function checkEnter(e) {
            if (e.key === 'Enter') validatePassword();
        }

        function validatePassword() {
            const input = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === CONFIG.passcode) {
                unlockSite();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }

        function unlockSite() {
            const lockScreen = document.getElementById('lock-screen');
            lockScreen.style.opacity = '0';
            setTimeout(() => {
                lockScreen.style.visibility = 'hidden';
            }, 800);

            const playPromise = track.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playBtn.innerHTML = '❚❚';
                    track.volume = 0;
                    let vol = 0;
                    const interval = setInterval(() => {
                        if (vol < 0.55) {
                            vol += 0.05;
                            track.volume = Math.min(vol, 0.55);
                        } else {
                            clearInterval(interval);
                        }
                    }, 100);
                }).catch(() => {
                    playBtn.classList.add('player-pulse');
                    playBtn.innerHTML = '▶';
                });
            }
        }

        function toggleAudio() {
            if (track.paused) {
                track.play();
                playBtn.innerHTML = '❚❚';
                playBtn.classList.remove('player-pulse');
            } else {
                track.pause();
                playBtn.innerHTML = '▶';
            }
        }

        function handleRoute() {
            const hash = window.location.hash || '#/';
            const container = document.getElementById('view-container');
            
            container.classList.add('view-hidden');
            setTimeout(() => {
                if (hash === '#/timeline') {
                    renderTimelineView(container);
                } else if (hash === '#/videos') {
                    renderVideosView(container);
                } else {
                    renderHomeView(container);
                }
                window.scrollTo(0, 0);
                container.classList.remove('view-hidden');
            }, 300);
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('popstate', handleRoute);

        function renderHomeView(container) {
            renderedPhotoCount = 0;
            container.innerHTML = `
                <section class="hero">
                    <h1 class="hero-names">${CONFIG.her} & ${CONFIG.me}</h1>
                    <div class="typewriter-text" id="typewriter"></div>
                    <div class="nav-links-bar">
                        <a href="#/timeline" class="nav-link">Timeline →</a>
                        <a href="#/videos" class="nav-link">Reels 🎥</a>
                    </div>
                </section>
                <div class="gallery-grid" id="galleryGrid"></div>
                <button class="load-more-btn" id="loadMoreBtn" onclick="loadMorePhotos()">Load More Memories</button>
            `;
            initTypewriter();
            loadMorePhotos();
        }

        function renderTimelineView(container) {
            let timelineHtml = CONFIG.timeline.map(item => {
                const dateObj = new Date(item.date);
                const month = dateObj.toLocaleString('en-US', { month: 'short' }).toUpperCase();
                const day = String(dateObj.getDate()).padStart(2, '0');
                const year = dateObj.getFullYear();

                return `
                    <div class="timeline-card">
                        <div class="date-block">
                            <span class="date-month-day">${day} ${month}</span>
                            <span class="date-year">${year}</span>
                        </div>
                        <div class="card-body">
                            <h3>${item.title}</h3>
                            <p>${item.body}</p>
                        </div>
                    </div>
                `;
            }).join('');

            timelineHtml += `
                <div class="timeline-card">
                    <div class="date-block">
                        <span class="date-month-day">26 SEP</span>
                        <span class="date-year">2026</span>
                    </div>
                    <div class="card-body">
                        <h3>One year</h3>
                        <p>365 days, endless memories, and a lifetime to go.</p>
                    </div>
                </div>
            `;

            container.innerHTML = `
                <section class="hero" style="padding-bottom: 1rem;">
                    <h1 class="hero-names" style="font-size: 2rem;">Timeline of Us</h1>
                    <div class="nav-links-bar">
                        <a href="#/" class="nav-link">← Home</a>
                        <a href="#/videos" class="nav-link">Reels 🎥</a>
                    </div>
                </section>
                <div class="timeline-list">${timelineHtml}</div>
            `;
        }

            let reelsHtml = CONFIG.videos.map((vid, idx) => `
                <div class="reel-card">
                    <video class="reel-video" loop playsinline onclick="toggleReelPlay(this)">
                        <source src="media/videos/${vid}" type="video/mp4">
                    </video>
                    <div class="reel-overlay">
                        <h4>Memory #${idx + 1}</h4>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <section class="hero" style="padding-bottom: 0.5rem;">
                    <h1 class="hero-names" style="font-size: 2rem;">Video Reels</h1>
                    <div class="nav-links-bar">
                        <a href="#/" class="nav-link">← Home</a>
                        <a href="#/timeline" class="nav-link">Timeline →</a>
                    </div>
                </section>
                <div class="reels-wrapper" id="reelsWrapper">${reelsHtml}</div>
            `;

            initReelsObserver();
        }

        function initReelsObserver() {
            const videos = document.querySelectorAll('.reel-video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.6 });

            videos.forEach(vid => observer.observe(vid));
        }

        function toggleReelPlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function loadMorePhotos() {
            const grid = document.getElementById('galleryGrid');
            const btn = document.getElementById('loadMoreBtn');
            if (!grid) return;

            const initialBatch = renderedPhotoCount === 0 ? 30 : 24;
            const nextBatch = CONFIG.photos.slice(renderedPhotoCount, renderedPhotoCount + initialBatch);

            nextBatch.forEach((file, index) => {
                const fullIdx = renderedPhotoCount + index;
                const box = document.createElement('div');
                box.className = 'photo-box';
                box.onclick = () => openLightbox(fullIdx);
                box.innerHTML = `<img src="media/photos/${file}" loading="lazy" decoding="async" alt="Memory">`;
                grid.appendChild(box);
            });

            renderedPhotoCount += nextBatch.length;

            if (renderedPhotoCount >= CONFIG.photos.length && btn) {
                btn.style.display = 'none';
            }
        }

        function openLightbox(index) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = `media/photos/${CONFIG.photos[index]}`;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function initTypewriter() {
            const el = document.getElementById('typewriter');
            if (!el) return;
            let lineIdx = 0, charIdx = 0, isDeleting = false;

            function type() {
                const currentLine = CONFIG.typewriter[lineIdx];
                if (isDeleting) {
                    el.textContent = currentLine.substring(0, charIdx--);
                } else {
                    el.textContent = currentLine.substring(0, charIdx++);
                }

                let speed = isDeleting ? 40 : 80;

                if (!isDeleting && charIdx === currentLine.length + 1) {
                    speed = 2000;
                    isDeleting = true;
                } else if (isDeleting && charIdx === 0) {
                    isDeleting = false;
                    lineIdx = (lineIdx + 1) % CONFIG.typewriter.length;
                    speed = 500;
                }

                setTimeout(type, speed);
            }
            type();
        }

        handleRoute();
    </script>
</body>
</html>
