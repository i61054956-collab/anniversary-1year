<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our 1-Year Timeline 📸✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #070714;
            color: #f8f9fa;
            font-family: 'Outfit', sans-serif;
            padding: 1.5rem 1rem;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            background: linear-gradient(135deg, #ffffff 0%, #ff80ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #e1bee7; font-size: 0.95rem; margin-top: 0.4rem; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .media-item {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 64, 129, 0.3);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .media-item img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px); z-index: 1000;
            justify-content: center; align-items: center; padding: 1rem;
        }
        .modal-content { max-width: 95%; max-height: 85vh; border-radius: 12px; }
        .back-nav { display: block; text-align: center; margin: 2.5rem 0 1rem; color: #ff80ab; text-decoration: none; font-weight: 600; }
    </style>
</head>
